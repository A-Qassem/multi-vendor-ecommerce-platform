services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Strong@Passw0rd!"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Strong@Passw0rd!' -Q 'SELECT 1' -No -C"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=db;Database=MultiVendorEcommerce;User Id=sa;Password=Strong@Passw0rd!;Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=True;"
      Jwt__Issuer: "MultiVendor.Ecommerce.Api"
      Jwt__Audience: "MultiVendor.Ecommerce.Clients"
      Jwt__ExpiresInMinutes: "15"
      Jwt__Key: "${JWT_KEY}"
    depends_on:
      db:
        condition: service_healthy

volumes:
  sqlserver_data:
